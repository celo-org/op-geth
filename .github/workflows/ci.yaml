  Generate:
    runs-on: ["ubuntu-latest"]
    steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-go@v5
          with:
            go-version: '1.22'
            cache: false

        - name: Install Protoc
          uses: arduino/setup-protoc@v3

        - name: Installing protoc-gen-go
          run: go get google.golang.org/protobuf

        - name: Generate check
          # Run go generate and see if anything changed.
          run: |
            echo $PATH || true
            echo "GOBIN"
            echo $GOBIN || true
            which protoc-gen-go || true
            which protoc || true
            echo "Running go generate ./..."  || true
            go generate ./...
            if [ -n "$(git status --porcelain)" ]; then
              echo "Changes detected after running 'go generate ./...' run generate locally and commit the changes."
              exit 1
            fi
